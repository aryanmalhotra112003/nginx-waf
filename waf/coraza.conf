# Coraza configuration
SecRuleEngine On
# Include OWASP CRS setup and rule files from coraza-crs image paths.
Include /opt/coraza/config/crs-setup.conf
Include /opt/coraza/owasp-crs/rules/*.conf

# A simple explicit rule to verify local custom rules are loaded.
SecRule ARGS "@rx <script>" "id:100,phase:2,deny,status:403,msg:'XSS Attempt Detected'"

# Emit JSON audit events to the shared host-mounted log volume.
# Use On so both malicious and non-malicious requests are logged.
SecAuditEngine On
SecAuditLogFormat JSON
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/audit.log

# Log Nginx rate-limited responses as explicit DoS-prevented events for dashboard visibility.
SecRule RESPONSE_STATUS "@streq 429" "id:1002,phase:5,pass,log,msg:'DoS Attack Prevented: High frequency of requests detected from IP'"

